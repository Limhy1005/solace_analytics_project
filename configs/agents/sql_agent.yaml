# Solace Agent Mesh Agent Configuration

log:
  stdout_log_level: INFO
  log_file_level: DEBUG
  log_file: a2a_agent.log

!include ../shared_config.yaml

apps:
  - name: "SqlAgent__app"
    app_base_path: .
    app_module: solace_agent_mesh.agent.sac.app
    broker:
      <<: *broker_connection

    app_config:
      namespace: "${NAMESPACE}"
      supports_streaming: true
      agent_name: "Sql"
      display_name: "Sql Agent"
      model: *planning_model 

      instruction: |
        <system_identity>
        **ROLE:** SQL Execution Controller.
        **MISSION:** Execute the approved Action Plan by delegating the complex translation and database execution to the Vanna-powered Python tool.
        </system_identity>

        <execution_framework>
        1. You will receive the user-approved 'Action Plan' from the Orchestrator. This plan contains hidden `<sql_metadata>` tags.
        2. **IMMEDIATE ACTION:** You MUST call the `execute_analytical_plan` tool exactly ONCE, passing the ENTIRE Action Plan text as the input payload. Do not attempt to parse, modify, or extract information from the Action Plan yourself. The tool is designed to autonomously handle the parsing of the business steps, the extraction of the hidden metadata, the generation of SQL queries, and the execution against the database.
        3. Do NOT attempt to read schemas, write SQL, or loop through steps yourself. The Python tool will handle the dynamic variable replacement, SQL generation, and sequential execution autonomously.
        4. **FINAL OUTPUT & ARTIFACT GENERATION (CRITICAL SYSTEM RULE):**
            Once the execute_analytical_plan tool returns the result data, you must save the output as a markdown artifact. 
            
            * **ACTION 1 (Text Formatting):** You must output the exact artifact syntax in your response, including all rows of data from ALL steps, just output this exact text structure:

                «««save_artifact: filename="sql_raw_data.md" mime_type="text/markdown"
                ### Analysis Results
                
                #### Step 1: [Description]
                [Insert full Step 1 Markdown table here]
                
                #### Step 2: [Description]
                [Insert full Step 2 Markdown table here]

                (Continue for all steps. DO NOT truncate data.)
                »»»
            
            **ACTION 2 (TASK COMPLETION):** After outputting the artifact block above, you MUST STOP. Output a single short sentence confirming to the Orchestrator that the data has been successfully retrieved and saved to "sql_raw_data.md", and do absolutely nothing else.
        </execution_framework>
                   
      tools: 
        - group_name: artifact_management
          tool_type: builtin-group
        
        - tool_type: python
          tool_name: execute_analytical_plan
          tool_description: >
            Executes a multi-step analytical plan using the Vanna AI engine.
            INPUT REQUIRED: The COMPLETE 'Action Plan' string exactly as received from the Orchestrator (must include the hidden <sql_metadata> tags).
            OUTPUT: Returns a JSON object containing the data from ALL executed steps, which you will then format into a markdown file as specified in the instructions.
          component_module: src.tools.sql_tools.sql_tools
          function_name: execute_analytical_plan

      session_service: 
        type: "sql"
        default_behavior: "PERSISTENT"
        database_url: "${SQL_DATABASE_URL, sqlite:///sql.db}"
      artifact_service: 
        type: "filesystem"
        base_path: "/tmp/samv2"
        artifact_scope: namespace
      
      artifact_handling_mode: "reference"
      enable_embed_resolution: true
      enable_artifact_content_instruction: true
      data_tools_config: *default_data_tools_config

      # Agent Card Definition
      # Agent Card Definition
      agent_card:
        description: |
          SQL Execution Gateway. 
          **ROUTING DIRECTIVE (STRICT):** This agent handles data retrieval by executing Action Plans.
          INPUT REQUIRED: You MUST extract and pass ONLY the "### Action Plan" section from the Planner's output. You MUST ensure the exact step descriptions, business formulas, and all hidden `<sql_metadata>` tags remain intact and unmodified. STRICTLY DO NOT pass the "Analysis Objective", "Key Metrics", or general "Tables Used" sections.
          OUTPUT: Returns the raw database results saved as a `.md` artifact file.
        defaultInputModes: [text] 
        defaultOutputModes: [text, file]  
        skills: 
          - id: plan_execution
            name: Action Plan Execution
            description: Seamlessly delegates complex multi-step analytical plans to the internal Vanna engine for highly accurate, hallucination-free data retrieval.

      # Discovery & Communication
      agent_card_publishing: 
        interval_seconds: 10
      agent_discovery: 
        enabled: false
      inter_agent_communication:
        allow_list: ["*"] 
        deny_list: [] 
        request_timeout_seconds: 600


      # **Phase 4: FINAL OUTPUT (DYNAMIC DELIVERY)**
      #   Evaluate the total number of rows returned by the executed queries to determine the delivery method. 

      #   **Condition A: Small Dataset (15 rows or fewer in total)**
      #   - Output the EXACT and COMPLETE raw data directly in your text response using standard Markdown tables.
      #   - Use clear headings to separate multiple queries (e.g., `### Step 1: Online Sales`).
      #   - ABSOLUTE RULE: DO NOT truncate the data. Output every single row.

      #   **Condition B: Large Dataset (More than 15 rows in total)**
      #   - Do NOT print massive tables directly in the chat text response.
      #   - You MUST use the strict artifact syntax below to physically save the EXACT and COMPLETE raw data into a file.
        
      #     «««save_artifact: filename="sql_raw_data.md" mime_type="text/markdown"
      #     ### Query Results
      #     [Insert ALL data rows here formatted as a standard Markdown table. DO NOT truncate!]
      #     »»»
          
      #   - In your text response, provide a concise 1-2 sentence summary indicating the query was successful and explicitly state: "The complete and detailed raw data has been saved to sql_raw_data.md".
